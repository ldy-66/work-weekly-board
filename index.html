<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>工作周记 · 任务看板</title>
  <style>

    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #6f9a7b66;outline-offset:2px}.app{max-width:1440px;margin:auto;padding:30px 34px 54px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:30px}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:40px;height:40px;border-radius:13px;background:var(--green);display:grid;place-items:center;color:white;font-weight:800;font-size:19px}.brand-name{font-weight:720;font-size:16px;letter-spacing:.01em}.brand-sub{font-size:12px;color:var(--muted);margin-top:1px}.top-actions{display:flex;gap:9px}.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 14px;font-size:13px;font-weight:600;transition:.15s}.btn:hover{border-color:#bdc8be;background:#fafcf9}.btn.primary{border-color:var(--green);background:var(--green);color:white}.btn.primary:hover{background:#28583d}.btn.quiet{background:transparent}.icon-btn{height:38px;width:40px;padding:0;border:1px solid var(--line);background:#fff;border-radius:11px;font-size:20px}.nav{display:flex;gap:6px;background:#e9ebe6;padding:5px;border-radius:13px;width:max-content;margin-bottom:27px}.nav button{border:0;background:transparent;color:var(--muted);padding:9px 19px;border-radius:10px;font-weight:650;font-size:14px}.nav button.active{background:#fff;color:var(--ink);box-shadow:0 2px 6px #20231f0d}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:20px}.eyebrow{color:var(--muted);font-size:12px;font-weight:650;letter-spacing:.08em;text-transform:uppercase}.page-title{font-size:29px;letter-spacing:-.035em;line-height:1.2;margin:5px 0 0;font-weight:720}.head-right{display:flex;align-items:center;gap:9px}.week-switch{display:flex;align-items:center;gap:5px}.week-switch .icon-btn{height:36px;width:36px;font-size:17px}.week-label{min-width:160px;text-align:center;font-size:13px;font-weight:650}.week-current{font-size:12px;color:var(--muted);margin-left:3px}.summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-bottom:20px}.summary-card{border:1px solid var(--line);background:var(--card);border-radius:15px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;min-height:85px;box-shadow:var(--shadow)}.summary-label{font-size:12px;color:var(--muted);font-weight:600}.summary-number{font-size:26px;font-weight:740;letter-spacing:-.04em;margin-top:2px}.summary-note{font-size:11px;color:var(--muted)}.summary-icon{height:37px;width:37px;display:grid;place-items:center;border-radius:12px;background:#f1f3ef;color:var(--green);font-weight:750}.summary-card.danger .summary-icon{background:var(--red-pale);color:var(--red)}.summary-card.warm .summary-icon{background:var(--amber-pale);color:var(--amber)}.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 17px;border-bottom:1px solid var(--line)}.toolbar-left,.toolbar-right{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.toolbar-title{font-weight:700;font-size:15px;margin-right:4px}.select,.search{height:36px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:0 10px;color:#424842;font-size:12px}.search{width:180px}.task-list{padding:5px 17px 13px}.task-row{display:grid;grid-template-columns:20px minmax(140px,1fr) minmax(100px,160px) 96px 142px auto;align-items:center;gap:13px;padding:14px 4px;border-bottom:1px solid #eff0ed;position:relative}.task-row:last-child{border-bottom:0}.task-row.dragging{opacity:.45}.task-row.drop-target{box-shadow:inset 0 3px var(--green)}.drag-handle{color:#a2a8a0;cursor:grab;user-select:none;font-size:16px}.check{appearance:none;width:18px;height:18px;border:1.5px solid #c8cec7;border-radius:6px;margin:0;display:grid;place-items:center;cursor:pointer}.check:checked{background:var(--green);border-color:var(--green)}.check:checked:after{content:"✓";font-size:12px;color:white;font-weight:800}.task-main{min-width:0}.task-title{font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task-title.done{text-decoration:line-through;color:#929891}.task-sub{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task-goal{font-size:11px;color:#667268;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.priority{border:0;background:transparent;font-size:12px;font-weight:700;padding:5px 3px;border-radius:7px;width:68px}.priority.P0{color:#b33c31}.priority.P1{color:#ad6814}.priority.P2{color:#54725e}.priority.P3{color:#828981}.deadline{font-size:11px;color:#505650}.deadline.overdue{color:var(--red);font-weight:700}.deadline-soon{color:var(--amber);font-weight:700}.row-controls{display:flex;gap:5px;justify-content:flex-end}.mini-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;font-size:11px;color:#626a62;white-space:nowrap}.mini-btn:hover{background:#f5f7f3;color:var(--ink)}.mini-btn.remove:hover{color:var(--red);border-color:#ecc8c1}.status-select{max-width:110px;border:1px solid var(--line);background:white;border-radius:8px;padding:6px 8px;font-size:11px;color:#4b524b}.empty{padding:48px 18px;text-align:center;color:var(--muted)}.empty-mark{font-size:27px;margin-bottom:9px}.empty strong{display:block;color:#39413a;margin-bottom:5px}.empty p{font-size:13px;margin:0 0 16px}.goal-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.quarter-tabs{display:flex;gap:6px;flex-wrap:wrap}.quarter-tab{border:1px solid var(--line);border-radius:9px;background:#fff;padding:8px 11px;font-size:12px;color:var(--muted);font-weight:600}.quarter-tab.active{color:var(--green);border-color:#b8cabb;background:var(--green-pale)}.goal-list{display:grid;gap:13px}.goal-card{padding:17px 19px}.goal-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.goal-left{display:flex;gap:12px;min-width:0}.goal-dot{width:10px;height:10px;margin-top:7px;border-radius:50%;background:var(--green);flex:none}.goal-name{font-size:16px;font-weight:700}.goal-desc{font-size:12px;color:var(--muted);margin-top:4px}.goal-meta{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}.chip{display:inline-flex;align-items:center;gap:5px;background:#f2f4f0;border-radius:100px;padding:5px 9px;color:#5c655c;font-size:11px;font-weight:600}.chip.due{background:var(--amber-pale);color:var(--amber)}.chip.done{background:var(--green-pale);color:var(--green)}.goal-actions{display:flex;gap:6px;flex:none}.goal-tasks{margin:15px 0 0 22px;border-top:1px solid var(--line);padding-top:10px}.goal-tasks.collapsed{display:none}.goal-task-item{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:12px;color:#505850}.goal-task-item .status-dot{width:6px;height:6px;border-radius:50%;background:#c7cec6}.goal-task-item .status-dot.complete{background:var(--green)}.goal-progress{font-size:11px;color:var(--muted)}.goal-empty-note{font-size:12px;color:#90978f;padding:8px 0}.filters-note{font-size:11px;color:#90978f}.notice{border:1px solid #e8d9b9;background:#fff9ed;border-radius:12px;padding:12px 14px;color:#785524;font-size:12px;display:flex;justify-content:space-between;gap:12px;margin-bottom:14px}.notice button{border:0;background:none;color:inherit;text-decoration:underline;font-size:11px}.hidden{display:none!important}dialog{border:0;border-radius:19px;padding:0;width:min(520px,calc(100vw - 28px));max-height:92vh;box-shadow:0 25px 90px #101b1240;color:var(--ink)}dialog::backdrop{background:#19211c66;backdrop-filter:blur(2px)}.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:19px 22px;border-bottom:1px solid var(--line)}.dialog-head h2{font-size:17px;margin:0}.dialog-body{padding:19px 22px 22px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:650;color:#586158}.field input,.field textarea,.field select{border:1px solid #dfe3dc;border-radius:9px;padding:10px 11px;background:#fff;min-width:0;color:var(--ink);font-size:13px}.field textarea{min-height:84px;resize:vertical}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.close-x{border:0;background:transparent;color:#7c847c;font-size:22px;line-height:1}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#26342b;color:white;padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 8px 22px #18231b2b;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}.footer-note{text-align:center;color:#9ba098;font-size:11px;margin-top:20px}.week-today{color:var(--green);font-weight:700}
    .task-row{grid-template-columns:18px 20px minmax(140px,1fr) minmax(100px,160px) 70px 142px auto}.mini-btn:disabled{opacity:.35;cursor:not-allowed}
    @media(max-width:900px){.app{padding:22px 20px 40px}.task-row{grid-template-columns:16px 20px minmax(120px,1fr) 64px 116px auto;gap:8px}.task-goal{display:none}.status-select{max-width:96px}.search{width:145px}}
    @media(max-width:620px){.app{padding:16px 13px 30px}.topbar{margin-bottom:22px}.brand-sub{display:none}.top-actions .btn{padding:8px 9px}.top-actions .btn span{display:none}.nav{width:100%;margin-bottom:20px}.nav button{flex:1;padding:9px 8px}.page-head{align-items:flex-start;flex-direction:column;margin-bottom:15px}.page-title{font-size:24px}.head-right{width:100%;justify-content:space-between}.week-label{min-width:0}.summary-grid{gap:7px;margin-bottom:13px}.summary-card{padding:11px 10px;min-height:77px}.summary-number{font-size:22px}.summary-label{font-size:10px}.summary-icon{height:30px;width:30px;border-radius:10px}.toolbar{align-items:flex-start;flex-direction:column;padding:13px}.toolbar-left,.toolbar-right{width:100%}.toolbar-right{justify-content:space-between}.search{flex:1;width:auto}.task-list{padding:3px 12px 10px}.task-row{grid-template-columns:18px minmax(0,1fr) 58px;gap:8px;padding:13px 0}.task-row .drag-handle{display:none}.task-row .priority{grid-column:3;grid-row:1;width:56px}.task-main{grid-column:2;grid-row:1}.task-row .deadline{grid-column:2;grid-row:2}.task-row .status-select{grid-column:3;grid-row:2;width:100%;font-size:10px;padding:5px}.task-row .row-controls{grid-column:1/-1;justify-content:flex-end;margin-top:-2px}.task-row .check{grid-column:1;grid-row:1}.goal-toolbar{align-items:flex-start;flex-direction:column}.goal-card{padding:15px}.goal-card-head{gap:8px}.goal-actions{flex-wrap:wrap;justify-content:flex-end}.goal-actions .mini-btn{padding:6px}.goal-name{font-size:15px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:1}.dialog-head,.dialog-body{padding-left:17px;padding-right:17px}.notice{align-items:flex-start}.status-desktop{display:none}}
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brand-mark">周</div><div><div class="brand-name">工作周记</div><div class="brand-sub">季度目标 · 周任务</div></div></div>
    <div class="top-actions">
      <button class="btn" id="exportBtn" title="导出所有目标和周任务为 JSON">↓ <span>导出备份</span></button>
      <button class="btn" id="importBtn" title="从 JSON 文件恢复数据">↑ <span>导入备份</span></button>
      <input id="importFile" type="file" accept="application/json,.json" hidden>
      <button class="btn primary" id="headerAddBtn">＋ <span>新建周任务</span></button>
    </div>
  </header>
  <nav class="nav" aria-label="页面导航"><button class="active" data-page="week">本周任务</button><button data-page="goals">季度目标</button></nav>
  <main id="weekPage">
    <div class="page-head">
      <div><div class="eyebrow" id="weekEyebrow">本周安排</div><h1 class="page-title" id="weekTitle">本周任务</h1></div>
      <div class="head-right"><div class="week-switch"><button class="icon-btn" id="prevWeek" aria-label="上一周">‹</button><div><div class="week-label" id="weekRange"></div><div class="week-current" id="weekCurrent"></div></div><button class="icon-btn" id="nextWeek" aria-label="下一周">›</button></div><button class="btn quiet" id="thisWeekBtn">回到本周</button></div>
    </div>
    <div class="summary-grid">
      <div class="summary-card danger"><div><div class="summary-label">逾期未完成</div><div class="summary-number" id="overdueCount">0</div></div><div class="summary-icon">!</div></div>
      <div class="summary-card warm"><div><div class="summary-label">3 天内到期</div><div class="summary-number" id="soonCount">0</div></div><div class="summary-icon">◷</div></div>
      <div class="summary-card"><div><div class="summary-label">高优先级待办</div><div class="summary-number" id="highCount">0</div></div><div class="summary-icon">↑</div></div>
    </div>
    <div id="pastDueNotice" class="notice hidden"></div>
    <section class="panel">
      <div class="toolbar"><div class="toolbar-left"><span class="toolbar-title">周任务</span><span class="filters-note" id="weekTaskCount">0 项</span></div><div class="toolbar-right"><input class="search" id="searchInput" type="search" placeholder="搜索任务" aria-label="搜索任务"><select class="select" id="statusFilter" aria-label="按状态筛选"><option value="all">全部状态</option><option value="todo">待办</option><option value="doing">进行中</option><option value="done">已完成</option></select><select class="select" id="goalFilter" aria-label="按季度目标筛选"><option value="all">全部目标</option><option value="none">未关联目标</option></select><select class="select" id="sortSelect" aria-label="任务排序"><option value="manual">手动排序</option><option value="priority">按优先级</option><option value="due">按到期时间</option></select></div></div>
      <div id="taskList" class="task-list"></div>
    </section>
  </main>
  <main id="goalsPage" class="hidden">
    <div class="page-head"><div><div class="eyebrow">方向与进展</div><h1 class="page-title">季度目标</h1></div><button class="btn primary" id="addGoalBtn">＋ 新建季度目标</button></div>
    <div class="goal-toolbar"><div class="quarter-tabs" id="quarterTabs"></div><select class="select" id="goalStatusFilter" aria-label="按目标状态筛选"><option value="active">进行中</option><option value="all">全部状态</option><option value="completed">已完成</option><option value="archived">已归档</option></select></div>
    <div class="goal-list" id="goalList"></div>
  </main>
  <div class="footer-note">数据保存在当前浏览器 · 定期导出 JSON 备份</div>
</div>

<dialog id="taskDialog"><form id="taskForm"><div class="dialog-head"><h2 id="taskDialogTitle">新建周任务</h2><button class="close-x" type="button" data-close="taskDialog" aria-label="关闭">×</button></div><div class="dialog-body"><input type="hidden" id="taskId"><div class="form-grid"><div class="field full"><label for="taskName">任务名称</label><input id="taskName" required maxlength="140" placeholder="写下要完成的事情"></div><div class="field"><label for="taskWeek">所属周（周一）</label><input id="taskWeek" type="date" required></div><div class="field"><label for="taskGoal">关联季度目标</label><select id="taskGoal"><option value="">暂不关联</option></select></div><div class="field"><label for="taskPriority">优先级</label><select id="taskPriority"><option value="P0">P0 · 最高</option><option value="P1">P1 · 高</option><option value="P2" selected>P2 · 普通</option><option value="P3">P3 · 较低</option></select></div><div class="field"><label for="taskStatus">状态</label><select id="taskStatus"><option value="todo">待办</option><option value="doing">进行中</option><option value="done">已完成</option></select></div><div class="field full"><label for="taskDue">到期日期与时间（选填）</label><input id="taskDue" type="datetime-local"></div><div class="field full"><label for="taskNotes">备注（选填）</label><textarea id="taskNotes" maxlength="1200" placeholder="补充需要记住的信息"></textarea></div></div><div class="dialog-actions"><button class="btn" type="button" data-close="taskDialog">取消</button><button class="btn primary" type="submit">保存任务</button></div></div></form></dialog>

<dialog id="goalDialog"><form id="goalForm"><div class="dialog-head"><h2 id="goalDialogTitle">新建季度目标</h2><button class="close-x" type="button" data-close="goalDialog" aria-label="关闭">×</button></div><div class="dialog-body"><input type="hidden" id="goalId"><div class="form-grid"><div class="field full"><label for="goalName">目标名称</label><input id="goalName" required maxlength="140" placeholder="例如：完成某项工作目标"></div><div class="field"><label for="goalYear">年份</label><input id="goalYear" type="number" min="2000" max="2200" required></div><div class="field"><label for="goalQuarter">季度</label><select id="goalQuarter"><option value="1">第一季度</option><option value="2">第二季度</option><option value="3">第三季度</option><option value="4">第四季度</option></select></div><div class="field"><label for="goalPriority">优先级</label><select id="goalPriority"><option value="P0">P0 · 最高</option><option value="P1">P1 · 高</option><option value="P2" selected>P2 · 普通</option><option value="P3">P3 · 较低</option></select></div><div class="field"><label for="goalDue">目标截止日期（选填）</label><input id="goalDue" type="date"></div><div class="field full"><label for="goalDescription">说明（选填）</label><textarea id="goalDescription" maxlength="1200" placeholder="描述目标和预期结果"></textarea></div></div><div class="dialog-actions"><button class="btn" type="button" data-close="goalDialog">取消</button><button class="btn primary" type="submit">保存目标</button></div></div></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
  const KEY='work-weekly-board-v1';
  const DAY=86400000;
  const pOrder={P0:0,P1:1,P2:2,P3:3};
  let now=new Date();
  const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
  const weekKey=d=>dateKey(mondayOf(d));
  const chinaKey=d=>{const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);const x=Object.fromEntries(parts.map(p=>[p.type,p.value]));return `${x.year}-${x.month}-${x.day}`};
  const todayKey=chinaKey(now), currentWeek=weekKey(parseLocal(todayKey));
  const seed=()=>({version:1,goals:[],tasks:[]});
  function uid(){return globalThis.crypto?.randomUUID?.()||`id-${Date.now()}-${Math.random().toString(36).slice(2)}`}
  function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return seed();const x=JSON.parse(raw);if(!x||!Array.isArray(x.goals)||!Array.isArray(x.tasks))return seed();return x}catch{return seed()}}
  let data=load(), viewWeek=currentWeek, page='week', selectedYear=mondayOf(now).getFullYear(),selectedQuarter=Math.floor(now.getMonth()/3)+1, dragId=null,toastTimer;
  const $=id=>document.getElementById(id);
  function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
  function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function fmtDate(d,opts={month:'numeric',day:'numeric'}){if(!d)return '';return new Intl.DateTimeFormat('zh-CN',opts).format(d)}
  function parseLocal(s){if(!s)return null;const [date,time='00:00']=s.split('T');const [y,m,d]=date.split('-').map(Number);const [h,min]=time.split(':').map(Number);return new Date(y,m-1,d,h||0,min||0)}
  function shanghaiMillis(s){const [date,time='00:00']=s.split('T');const [y,m,d]=date.split('-').map(Number);const [h,min]=time.split(':').map(Number);return Date.UTC(y,m-1,d,(h||0)-8,min||0)}
  function formatDeadline(s){const d=parseLocal(s);if(!d)return '未设到期时间';const overdue=s.includes('T')?shanghaiMillis(s)<now.getTime():s<todayKey;return `${fmtDate(d)}${s.includes('T')?' '+s.split('T')[1]:''}${overdue?' · 已逾期':''}`}
  function isOverdue(t){if(t.status==='done'||!t.due)return false;return t.due.includes('T')?shanghaiMillis(t.due)<now.getTime():t.due<todayKey}
  function isSoon(t){if(t.status==='done'||!t.due)return false;if(t.due.includes('T')){const due=shanghaiMillis(t.due);return due>=now.getTime()&&due<=now.getTime()+3*DAY}const end=parseLocal(todayKey);end.setDate(end.getDate()+3);return t.due>=todayKey&&t.due<=dateKey(end)}
  function quarterLabel(y,q){return `${y} 年第 ${q} 季度`}
  function dateWeekRange(key){const d=parseLocal(key);const e=new Date(d);e.setDate(e.getDate()+6);return `${fmtDate(d,{year:'numeric',month:'numeric',day:'numeric'})} – ${fmtDate(e,{year:'numeric',month:'numeric',day:'numeric'})}`}
  function showToast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}
  function activeGoals(){return data.goals.filter(g=>g.status!=='archived')}
  function updateGoalOptions(selected=''){const sel=$('taskGoal');sel.innerHTML='<option value="">暂不关联</option>'+activeGoals().map(g=>`<option value="${esc(g.id)}">${esc(g.name)} · ${g.year} Q${g.quarter}</option>`).join('');sel.value=selected}
  function render(){renderNav();renderWeek();renderGoals();updateGoalFilter()}
  function renderNav(){$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('weekPage').classList.toggle('hidden',page!=='week');$('goalsPage').classList.toggle('hidden',page!=='goals');$('headerAddBtn').classList.toggle('hidden',page!=='week')}
  function $$(s){return [...document.querySelectorAll(s)]}
  function renderWeek(){
    const start=parseLocal(viewWeek),end=new Date(start);end.setDate(end.getDate()+6);
    $('weekTitle').textContent=viewWeek===currentWeek?'本周任务':'周任务';$('weekEyebrow').textContent=viewWeek===currentWeek?'本周安排':`${start.getFullYear()} 年第 ${Math.ceil((start-new Date(start.getFullYear(),0,1))/604800000)} 周`;
    $('weekRange').textContent=`${fmtDate(start)} – ${fmtDate(end,{month:'numeric',day:'numeric',year:'numeric'})}`;$('weekCurrent').textContent=viewWeek===currentWeek?'当前周':'';$('weekCurrent').classList.toggle('week-today',viewWeek===currentWeek);
    const open=data.tasks.filter(t=>t.status!=='done');$('overdueCount').textContent=open.filter(isOverdue).length;$('soonCount').textContent=open.filter(isSoon).length;$('highCount').textContent=open.filter(t=>t.priority==='P0'||t.priority==='P1').length;
    renderPastDue();
    let list=data.tasks.filter(t=>t.week===viewWeek);
    const status=$('statusFilter').value,goal=$('goalFilter').value,query=$('searchInput').value.trim().toLowerCase(),sort=$('sortSelect').value;
    if(status!=='all')list=list.filter(t=>t.status===status);if(goal==='none')list=list.filter(t=>!t.goalId);else if(goal!=='all')list=list.filter(t=>t.goalId===goal);if(query)list=list.filter(t=>(t.name+' '+t.notes).toLowerCase().includes(query));
    if(sort==='priority')list.sort((a,b)=>pOrder[a.priority]-pOrder[b.priority]||a.order-b.order);else if(sort==='due')list.sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')||a.order-b.order);else list.sort((a,b)=>a.order-b.order);
    $('weekTaskCount').textContent=`${list.length} 项`;
    const root=$('taskList');if(!list.length){root.innerHTML=`<div class="empty"><div class="empty-mark">☷</div><strong>${query||status!=='all'||goal!=='all'?'没有匹配的任务':'这周还没有任务'}</strong><p>${query||status!=='all'||goal!=='all'?'试试调整筛选条件。':'添加周任务，开始安排本周工作。'}</p>${!query&&status==='all'&&goal==='all'?'<button class="btn primary" id="emptyAdd">＋ 新建周任务</button>':''}</div>`;const b=$('emptyAdd');if(b)b.onclick=()=>openTask();return}
    root.innerHTML=list.map(taskRow).join('');bindTaskRows();
  }
  function renderPastDue(){const old=data.tasks.filter(t=>t.week!==viewWeek&&isOverdue(t));const box=$('pastDueNotice');if(!old.length){box.classList.add('hidden');box.innerHTML='';return}box.classList.remove('hidden');box.innerHTML=`<div><b>${old.length} 项逾期任务</b> 在其他周计划中，可移到当前查看的这周。<div class="notice-items">${old.map(t=>`<span class="notice-item">${esc(t.name)} <button data-move-overdue="${esc(t.id)}">移入本周</button></span>`).join('')}</div></div><button id="moveAllOverdue">全部移到本周</button>`;$$('[data-move-overdue]').forEach(b=>b.onclick=()=>{const t=getTask(b.dataset.moveOverdue);if(!t)return;t.week=viewWeek;t.order=nextOrder(viewWeek);save();showToast('任务已移到当前周')});$('moveAllOverdue').onclick=()=>{old.forEach(t=>{t.week=viewWeek;t.order=nextOrder(viewWeek)});save();showToast('逾期任务已移到当前周')}}
  function updateGoalFilter(){const sel=$('goalFilter'),v=sel.value;const opts='<option value="all">全部目标</option><option value="none">未关联目标</option>'+activeGoals().map(g=>`<option value="${esc(g.id)}">${esc(g.name)}</option>`).join('');sel.innerHTML=opts;if([...sel.options].some(o=>o.value===v))sel.value=v;else sel.value='all'}
  function taskRow(t){const g=data.goals.find(x=>x.id===t.goalId),deadline=t.due?formatDeadline(t.due):'未设到期时间';const overdue=isOverdue(t),soon=isSoon(t),siblings=data.tasks.filter(x=>x.week===t.week).sort((a,b)=>a.order-b.order),position=siblings.findIndex(x=>x.id===t.id),manual=$('sortSelect').value==='manual';return `<div class="task-row" draggable="${manual}" data-id="${esc(t.id)}"><span class="drag-handle" title="拖动排序">⠿</span><input class="check" type="checkbox" aria-label="标记完成" ${t.status==='done'?'checked':''} data-action="toggle"><div class="task-main"><div class="task-title ${t.status==='done'?'done':''}" title="${esc(t.name)}">${esc(t.name)}</div>${t.notes?`<div class="task-sub">${esc(t.notes)}</div>`:''}</div><div class="task-goal" title="${g?esc(g.name):'未关联季度目标'}">${g?esc(g.name):'<span style="color:#a0a59f">未关联目标</span>'}</div><select class="priority ${t.priority}" aria-label="调整优先级" data-action="priority">${['P0','P1','P2','P3'].map(p=>`<option value="${p}" ${t.priority===p?'selected':''}>${p}</option>`).join('')}</select><div class="deadline ${overdue?'overdue':soon?'deadline-soon':''}">${esc(deadline)}</div><div class="row-controls"><select class="status-select" aria-label="任务状态" data-action="status"><option value="todo" ${t.status==='todo'?'selected':''}>待办</option><option value="doing" ${t.status==='doing'?'selected':''}>进行中</option><option value="done" ${t.status==='done'?'selected':''}>已完成</option></select>${manual?`<button class="mini-btn" data-action="up" aria-label="上移" title="上移" ${position===0?'disabled':''}>↑</button><button class="mini-btn" data-action="down" aria-label="下移" title="下移" ${position===siblings.length-1?'disabled':''}>↓</button>`:''}<button class="mini-btn" data-action="edit">编辑</button>${t.week!==currentWeek?'<button class="mini-btn" data-action="move">移到本周</button>':''}<button class="mini-btn remove" data-action="delete">删除</button></div></div>`}
  function bindTaskRows(){ $$('.task-row').forEach(row=>{const id=row.dataset.id;row.querySelector('[data-action="toggle"]').onchange=e=>{const t=getTask(id);t.status=e.target.checked?'done':'todo';save()};row.querySelector('[data-action="priority"]').onchange=e=>{getTask(id).priority=e.target.value;save()};row.querySelector('[data-action="status"]').onchange=e=>{getTask(id).status=e.target.value;save()};row.querySelector('[data-action="edit"]').onclick=()=>openTask(getTask(id));row.querySelector('[data-action="delete"]').onclick=()=>{if(confirm('删除这项周任务？')){data.tasks=data.tasks.filter(t=>t.id!==id);save();showToast('任务已删除')}};['up','down'].forEach(action=>{const button=row.querySelector(`[data-action="${action}"]`);if(button)button.onclick=()=>{const t=getTask(id),ordered=data.tasks.filter(x=>x.week===t.week).sort((a,b)=>a.order-b.order),from=ordered.findIndex(x=>x.id===id),to=from+(action==='up'?-1:1);if(to<0||to>=ordered.length)return;ordered.splice(to,0,ordered.splice(from,1)[0]);ordered.forEach((x,i)=>x.order=i);save()}});const move=row.querySelector('[data-action="move"]');if(move)move.onclick=()=>{const t=getTask(id);t.week=currentWeek;t.order=nextOrder(currentWeek);save();showToast('任务已移到本周')};row.addEventListener('dragstart',e=>{if($('sortSelect').value!=='manual'){e.preventDefault();return}dragId=id;row.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',id)});row.addEventListener('dragend',()=>{dragId=null;row.classList.remove('dragging');$$('.task-row').forEach(x=>x.classList.remove('drop-target'))});row.addEventListener('dragover',e=>{if(!dragId||dragId===id)return;e.preventDefault();row.classList.add('drop-target')});row.addEventListener('dragleave',()=>row.classList.remove('drop-target'));row.addEventListener('drop',e=>{e.preventDefault();row.classList.remove('drop-target');const from=getTask(dragId),to=getTask(id);if(!from||!to||from.week!==to.week)return;const ordered=data.tasks.filter(x=>x.week===viewWeek).sort((a,b)=>a.order-b.order),a=ordered.findIndex(x=>x.id===from.id),b=ordered.findIndex(x=>x.id===to.id);ordered.splice(a,1);ordered.splice(b,0,from);ordered.forEach((x,i)=>x.order=i);save()})})}
  function renderGoals(){
    renderQuarterTabs();const goals=data.goals.filter(g=>g.year===selectedYear&&g.quarter===selectedQuarter);const filter=$('goalStatusFilter').value;const shown=filter==='all'?goals:goals.filter(g=>g.status===filter);const root=$('goalList');if(!shown.length){root.innerHTML=`<div class="panel empty"><div class="empty-mark">◎</div><strong>${goals.length?'没有符合条件的目标':`${quarterLabel(selectedYear,selectedQuarter)}还没有目标`}</strong><p>新增一个季度目标，并把每周要做的任务直接关联到它。</p><button class="btn primary" id="goalEmptyAdd">＋ 新建季度目标</button></div>`;$('goalEmptyAdd').onclick=()=>openGoal();return}
    root.innerHTML=shown.map(g=>{const linked=data.tasks.filter(t=>t.goalId===g.id),done=linked.filter(t=>t.status==='done').length,collapsed=!!g.collapsed,pr=`<span class="chip">${g.priority}</span>`,due=g.due?`<span class="chip due">截止 ${esc(fmtDate(parseLocal(g.due)))}</span>`:'',state=g.status==='completed'?'<span class="chip done">已完成</span>':g.status==='archived'?'<span class="chip">已归档</span>':'<span class="chip">进行中</span>';return `<article class="panel goal-card"><div class="goal-card-head"><div class="goal-left"><span class="goal-dot" style="${g.status==='completed'?'background:#8ea394':g.status==='archived'?'background:#c5cbc5':''}"></span><div><div class="goal-name">${esc(g.name)}</div>${g.description?`<div class="goal-desc">${esc(g.description)}</div>`:''}<div class="goal-meta">${pr}${due}${state}<span class="goal-progress">关联周任务 ${done}/${linked.length} 项完成</span></div></div></div><div class="goal-actions"><button class="mini-btn" data-goal-action="toggle" data-id="${esc(g.id)}">${collapsed?'展开':'收起'}</button><button class="mini-btn" data-goal-action="addTask" data-id="${esc(g.id)}">＋ 周任务</button><button class="mini-btn" data-goal-action="edit" data-id="${esc(g.id)}">编辑</button><button class="mini-btn" data-goal-action="complete" data-id="${esc(g.id)}">${g.status==='completed'?'恢复':'完成'}</button><button class="mini-btn" data-goal-action="archive" data-id="${esc(g.id)}">${g.status==='archived'?'取消归档':'归档'}</button></div></div><div class="goal-tasks ${collapsed?'collapsed':''}">${linked.length?linked.sort((a,b)=>a.week.localeCompare(b.week)||a.order-b.order).map(t=>`<div class="goal-task-item"><span class="status-dot ${t.status==='done'?'complete':''}"></span><span style="${t.status==='done'?'text-decoration:line-through;color:#929891':''}">${esc(t.name)}</span><span style="margin-left:auto;color:#90978f">${esc(dateWeekRange(t.week))}</span></div>`).join(''):'<div class="goal-empty-note">还没有关联的周任务</div>'}</div></article>`}).join('');
    $$('[data-goal-action]').forEach(b=>b.onclick=()=>{const g=data.goals.find(x=>x.id===b.dataset.id);if(!g)return;switch(b.dataset.goalAction){case'toggle':g.collapsed=!g.collapsed;save();break;case'addTask':openTask(null,g.id);break;case'edit':openGoal(g);break;case'complete':g.status=g.status==='completed'?'active':'completed';save();showToast(g.status==='completed'?'目标已完成':'目标已恢复');break;case'archive':g.status=g.status==='archived'?'active':'archived';save();showToast(g.status==='archived'?'目标已归档':'目标已取消归档')}})
  }
  function renderQuarterTabs(){const years=new Set([new Date().getFullYear(),...data.goals.map(g=>g.year)]);for(let y=selectedYear-1;y<=selectedYear+1;y++)years.add(y);$('quarterTabs').innerHTML=[...years].sort((a,b)=>a-b).flatMap(y=>[1,2,3,4].map(q=>`<button class="quarter-tab ${selectedYear===y&&selectedQuarter===q?'active':''}" data-year="${y}" data-quarter="${q}">${y} Q${q}</button>`)).join('');$$('.quarter-tab').forEach(b=>b.onclick=()=>{selectedYear=Number(b.dataset.year);selectedQuarter=Number(b.dataset.quarter);renderGoals()})}
  function getTask(id){return data.tasks.find(t=>t.id===id)}function nextOrder(w){return Math.max(-1,...data.tasks.filter(t=>t.week===w).map(t=>t.order||0))+1}
  function openTask(task=null,goalId=''){const form=$('taskForm');form.reset();$('taskId').value=task?.id||'';$('taskDialogTitle').textContent=task?'编辑周任务':'新建周任务';$('taskName').value=task?.name||'';$('taskWeek').value=task?.week||viewWeek;$('taskPriority').value=task?.priority||'P2';$('taskStatus').value=task?.status||'todo';$('taskDue').value=task?.due||'';$('taskNotes').value=task?.notes||'';updateGoalOptions(task?.goalId||goalId);$('taskDialog').showModal();$('taskName').focus()}
  function openGoal(goal=null){$('goalForm').reset();$('goalId').value=goal?.id||'';$('goalDialogTitle').textContent=goal?'编辑季度目标':'新建季度目标';$('goalName').value=goal?.name||'';$('goalYear').value=goal?.year||selectedYear;$('goalQuarter').value=goal?.quarter||selectedQuarter;$('goalPriority').value=goal?.priority||'P2';$('goalDue').value=goal?.due||'';$('goalDescription').value=goal?.description||'';$('goalDialog').showModal();$('goalName').focus()}
  $('taskForm').onsubmit=e=>{e.preventDefault();const id=$('taskId').value,week=weekKey(parseLocal($('taskWeek').value));let t=id?getTask(id):null;if(!t){t={id:uid(),order:nextOrder(week)};data.tasks.push(t)}else if(t.week!==week)t.order=nextOrder(week);Object.assign(t,{name:$('taskName').value.trim(),week,goalId:$('taskGoal').value,priority:$('taskPriority').value,due:$('taskDue').value,status:$('taskStatus').value,notes:$('taskNotes').value.trim()});$('taskDialog').close();save();showToast(id?'任务已更新':'周任务已添加')};
  $('goalForm').onsubmit=e=>{e.preventDefault();const id=$('goalId').value;let g=data.goals.find(x=>x.id===id);if(!g){g={id:uid(),status:'active'};data.goals.push(g)}Object.assign(g,{name:$('goalName').value.trim(),year:Number($('goalYear').value),quarter:Number($('goalQuarter').value),priority:$('goalPriority').value,due:$('goalDue').value,description:$('goalDescription').value.trim()});selectedYear=g.year;selectedQuarter=g.quarter;$('goalDialog').close();save();showToast(id?'目标已更新':'季度目标已添加')};
  $('headerAddBtn').onclick=()=>openTask();$('addGoalBtn').onclick=()=>openGoal();
  $('prevWeek').onclick=()=>{const d=parseLocal(viewWeek);d.setDate(d.getDate()-7);viewWeek=dateKey(d);renderWeek()};$('nextWeek').onclick=()=>{const d=parseLocal(viewWeek);d.setDate(d.getDate()+7);viewWeek=dateKey(d);renderWeek()};$('thisWeekBtn').onclick=()=>{viewWeek=currentWeek;renderWeek()};
  ['statusFilter','goalFilter','sortSelect'].forEach(id=>$(id).onchange=renderWeek);$('searchInput').oninput=renderWeek;$('goalStatusFilter').onchange=renderGoals;
  $$('.nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;renderNav()});$$('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());
  $('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({format:'work-weekly-board',version:1,exportedAt:new Date().toISOString(),...data},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`工作周记备份-${todayKey}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);showToast('备份文件已导出')};
  $('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const x=JSON.parse(await file.text());const goals=x.goals,tasks=x.tasks;if(!Array.isArray(goals)||!Array.isArray(tasks)||!tasks.every(t=>t&&typeof t.name==='string'&&typeof t.week==='string')||!goals.every(g=>g&&typeof g.name==='string'))throw new Error('文件结构不正确');if(!confirm(`将导入 ${goals.length} 个季度目标和 ${tasks.length} 项周任务，并替换当前浏览器数据。继续吗？`))return;data={version:1,goals,tasks};save();showToast('数据导入成功')}catch(err){alert(`导入失败：${err.message||'请检查 JSON 文件'}`)}finally{e.target.value=''}};
  window.addEventListener('storage',e=>{if(e.key===KEY){data=load();render();showToast('已同步其他标签页的更改')}});
  render();
  setInterval(()=>{now=new Date();renderWeek()},60000);
})();
</script>
